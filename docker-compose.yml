services:
  redis:
    image: redis:7-alpine
    container_name: kalki-pulse-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.8.0
    container_name: kalki-pulse-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    restart: unless-stopped

  backend:
    image: python:3.12-slim
    container_name: kalki-pulse-backend
    working_dir: /app/Backend
    volumes:
      - ./:/app
    ports:
      - "8000:8000"
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-kalki-pulse-dev-secret-key-min-32-bytes-long-2026!}
      INGESTION_MODE: ${INGESTION_MODE:-embedded_replay}
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt onnxruntime numpy pydantic &&
             uvicorn main:app --host 0.0.0.0 --port 8000"
    depends_on:
      - redis
      - kafka
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    container_name: kalki-pulse-frontend
    working_dir: /app/Frontend
    volumes:
      - ./:/app
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    command: sh -c "npm install --legacy-peer-deps && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
    restart: unless-stopped
